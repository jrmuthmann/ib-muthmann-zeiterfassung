<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<title>Zeiterfassung · Ingenieurbüro Muthmann</title>
<style>
  :root { --akzent:#1f4e79; --akzent-bg:#e8eef5; --gruen:#2e7d4f; --gruen-bg:#e6f2ea; --rot:#b3261e; --rot-bg:#fbe9e7; --gelb:#8a6100; --gelb-bg:#fdf3d8; --linie:#cfcdc6; --linie2:#e2e1dc; --text2:#5c5b56; --text3:#8b8a84; --bg:#f4f4f2; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:#1d1d1b; font-size:16px; overscroll-behavior-y:none; }
  header { position:sticky; top:0; z-index:5; background:var(--akzent); color:#fff; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; flex:1; font-weight:600; }
  header .wer { font-size:12px; opacity:.85; }
  header button { background:none; border:0; color:#fff; font-size:20px; padding:4px 6px; }
  main { padding:14px 14px calc(90px + env(safe-area-inset-bottom)); max-width:600px; margin:0 auto; }
  nav.tabs { position:fixed; bottom:0; left:0; right:0; z-index:5; display:flex; background:#fff; border-top:1px solid var(--linie2); padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs button { flex:1; background:none; border:0; padding:10px 0 12px; font:inherit; font-size:12.5px; color:var(--text3); display:flex; flex-direction:column; align-items:center; gap:2px; }
  nav.tabs button span { font-size:20px; line-height:1; }
  nav.tabs button.aktiv { color:var(--akzent); font-weight:600; }
  .karte { background:#fff; border:1px solid var(--linie2); border-radius:12px; padding:14px; margin-bottom:12px; }
  h2 { font-size:15px; margin:0 0 10px; }
  label.f { display:block; font-size:13px; color:var(--text2); margin:12px 0 4px; }
  input, select, textarea { width:100%; font:inherit; font-size:16px; padding:11px 12px; border:1px solid var(--linie); border-radius:9px; background:#fff; color:inherit; }
  textarea { min-height:70px; resize:vertical; }
  input[type=time], input[type=date] { min-height:46px; }
  .zwei { display:flex; gap:10px; } .zwei > * { flex:1; min-width:0; }
  button.haupt { font:inherit; font-weight:600; border:0; border-radius:10px; padding:14px 16px; background:var(--akzent); color:#fff; width:100%; margin-top:16px; font-size:16px; }
  button.zweit { font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 16px; background:var(--akzent-bg); color:var(--akzent); width:100%; margin-top:10px; }
  button.gefahr { font:inherit; border:1px solid #e3b5b1; border-radius:10px; padding:12px 16px; background:#fff; color:var(--rot); width:100%; margin-top:10px; }
  button:disabled { opacity:.5; }
  .klein { font-size:13px; color:var(--text2); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .chip { font:inherit; font-size:14px; background:#fff; border:1px solid var(--linie); border-radius:16px; padding:6px 12px; color:inherit; }
  .chip.an { background:var(--akzent-bg); border-color:var(--akzent); color:var(--akzent); font-weight:600; }
  .check { display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid var(--linie); border-radius:9px; padding:12px; margin-top:12px; }
  .check input { width:auto; transform:scale(1.4); }
  /* Uhren */
  .tim { background:#fff; border:1px solid var(--linie2); border-radius:12px; padding:12px; margin-bottom:10px; display:flex; align-items:center; gap:10px; }
  .tim.lauf { border-color:var(--gruen); box-shadow:inset 4px 0 0 var(--gruen); }
  .tim.pause { box-shadow:inset 4px 0 0 #d9a520; }
  .tim .t { flex:1; min-width:0; }
  .tim .t b { display:block; font-size:15px; }
  .tim .t span { font-size:12.5px; color:var(--text2); display:block; margin-top:2px; }
  .tim .t span.warn { color:var(--gelb); }
  .uhr { font-variant-numeric:tabular-nums; font-size:20px; font-weight:600; text-align:right; white-space:nowrap; }
  .uhr small { font-size:12px; color:var(--text3); font-weight:400; }
  .rund { width:52px; height:52px; border-radius:50%; border:0; display:flex; align-items:center; justify-content:center; font-size:19px; color:#fff; flex-shrink:0; }
  .rund.play { background:var(--gruen); } .rund.stop { background:var(--rot); } .rund.leer { background:var(--akzent-bg); color:var(--akzent); }
  /* Listen */
  .tag { display:flex; justify-content:space-between; font-size:13px; color:var(--text2); margin:16px 2px 6px; font-weight:600; }
  .eintrag { background:#fff; border:1px solid var(--linie2); border-radius:10px; padding:11px 12px; margin-bottom:8px; }
  .eintrag .z { display:flex; justify-content:space-between; gap:8px; }
  .eintrag b { font-size:15px; }
  .eintrag .k { color:var(--text2); font-size:13px; margin-top:2px; }
  .pill { display:inline-block; font-size:11.5px; border-radius:10px; padding:1px 8px; margin:4px 4px 0 0; background:var(--akzent-bg); color:var(--akzent); }
  .pill.g { background:var(--gruen-bg); color:var(--gruen); } .pill.y { background:var(--gelb-bg); color:var(--gelb); } .pill.r { background:var(--rot-bg); color:var(--rot); }
  .summen { display:flex; gap:10px; } .summen div { flex:1; background:#fff; border:1px solid var(--linie2); border-radius:10px; padding:10px; } .summen b { display:block; font-size:20px; } .summen span { font-size:12px; color:var(--text2); }
  .abschnitt { display:flex; gap:8px; align-items:center; margin-bottom:8px; } .abschnitt input { flex:1; } .abschnitt button { background:none; border:0; font-size:20px; color:var(--text3); padding:6px; }
  .pausehinweis { font-size:12.5px; color:var(--gelb); margin:-2px 0 8px 4px; }
  ul.ordner { list-style:none; padding:0; margin:8px 0 0; border:1px solid var(--linie2); border-radius:9px; overflow:hidden; background:#fff; }
  ul.ordner li { padding:13px 12px; border-bottom:1px solid #eee; }
  ul.ordner li:last-child { border-bottom:0; }
  ul.ordner li.zurueck { color:var(--akzent); font-weight:600; }
  .pfad { font-size:13px; background:#eceae5; border-radius:6px; padding:6px 8px; word-break:break-all; margin-top:6px; }
  .leer { text-align:center; color:var(--text3); padding:30px 10px; }
  /* Overlay */
  .ov { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .ov .blatt { background:var(--bg); width:100%; max-width:600px; max-height:92vh; overflow:auto; border-radius:16px 16px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom)); }
  .ov .blatt h2 { font-size:17px; display:flex; justify-content:space-between; align-items:center; }
  .ov .blatt h2 button { background:none; border:0; font-size:22px; color:var(--text3); }
  #status { display:none; position:sticky; top:calc(50px + env(safe-area-inset-top)); z-index:4; padding:9px 16px; font-size:13.5px; text-align:center; }
  #status.offline { background:var(--gelb-bg); color:var(--gelb); }
  #status.konflikt { background:var(--rot-bg); color:var(--rot); font-weight:600; }
  #toast { position:fixed; left:14px; right:14px; top:calc(62px + env(safe-area-inset-top)); z-index:30; display:none; }
  #toast div { max-width:560px; margin:0 auto; border-radius:10px; padding:11px 14px; color:#fff; background:var(--gruen); font-size:14.5px; box-shadow:0 4px 14px rgba(0,0,0,.2); }
  #toast div.fehler { background:var(--rot); }
  .lade { text-align:center; padding:40px 10px; color:var(--text2); }
  footer.ver { text-align:center; font-size:11.5px; color:var(--text3); margin-top:24px; }

  /* Uhr zum Auswählen der Zeit (wie Android-Wecker) */
  input.uhrzeit { cursor:pointer; font-variant-numeric:tabular-nums; caret-color:transparent; }
  .uhrwahl { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; }
  .uhrwahl .box { background:#fff; border-radius:22px; width:320px; max-width:calc(100vw - 24px); padding:18px 18px 12px; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  .uhrwahl .titel { font-size:13px; color:var(--text2); margin-bottom:8px; }
  .uhrwahl .anzeige { display:flex; align-items:center; justify-content:center; gap:4px; margin-bottom:14px; }
  .uhrwahl .anzeige button { font:inherit; font-size:46px; font-weight:500; line-height:1; border:0; border-radius:12px; padding:8px 12px; background:#eceae5; color:#1d1d1b; font-variant-numeric:tabular-nums; }
  .uhrwahl .anzeige button.an { background:var(--akzent-bg); color:var(--akzent); }
  .uhrwahl .anzeige span { font-size:46px; }
  .uhrwahl svg { display:block; margin:0 auto; touch-action:none; user-select:none; -webkit-user-select:none; }
  .uhrwahl .knoepfe { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .uhrwahl .knoepfe button { font:inherit; font-weight:600; border:0; background:none; color:var(--akzent); padding:10px 12px; font-size:15px; border-radius:8px; }
</style>
</head>
<body>
<header><h1 id="titel">Zeiten</h1><span class="wer" id="wer"></span><button id="neuladen" title="Aktualisieren" aria-label="Aktualisieren">↻</button><button id="einst" title="Einstellungen" aria-label="Einstellungen">⚙</button></header>
<div id="status"></div>
<main id="main"><div class="lade">Lädt …</div></main>
<nav class="tabs" id="tabs">
  <button data-tab="zeiten"><span>⏱</span>Zeiten</button>
  <button data-tab="nachtragen"><span>＋</span>Nachtragen</button>
  <button data-tab="liste"><span>☰</span>Meine Stunden</button>
</nav>
<div id="toast"><div></div></div>
<script>
(function () {
  'use strict';
  const VERSION = '1.2.1';
  const STANDARD_URL = 'https://nx103308.your-storageshare.de';
  const TAGE_LISTE = 62;          // so weit zurück werden eigene Einträge geladen
  const MAX_LAUF_STD = 10;        // länger laufende Uhren: nachfragen

  // ---------------------------------------------------------------- Hilfen
  const $ = id => document.getElementById(id);
  const h = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const isoTag = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const heute = () => isoTag(new Date());
  const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
  const r4 = v => Math.round(v * 10000) / 10000;
  const WT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const fmtTag = iso => { if (!iso) return ''; const d = new Date(iso + 'T12:00:00'); return WT[d.getDay()] + ' ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.'; };
  const zeitMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '').trim()); return m && +m[1] < 24 && +m[2] < 60 ? +m[1] * 60 + +m[2] : NaN; };
  const abschnittMin = z => { const a = zeitMin(z.von), b = zeitMin(z.bis); return isNaN(a) || isNaN(b) ? 0 : (b - a + 1440) % 1440; };
  const rohMinuten = s => (s.zeiten || []).reduce((a, z) => a + abschnittMin(z), 0) - (+s.pauseMin || 0);
  const zeitenMinuten = s => Math.max(0, Math.round(rohMinuten(s) / 5) * 5);   // auf 5 Minuten gerundet (wie am PC)
  const stundenAusZeiten = s => r4(zeitenMinuten(s) / 60);
  const fmtStd = v => { if (v === '' || v === null || v === undefined || isNaN(+v)) return ''; const m = Math.round(+v * 60); return Math.floor(m / 60) + ':' + pad(m % 60); };
  const fmtMin = m => Math.floor(m / 60) + ':' + pad(Math.round(m) % 60);
  const parseStd = t => {
    const x = String(t || '').trim().replace(/\s+/g, '');
    const m = /^(\d{1,2}):(\d{1,2})$/.exec(x); if (m) return +m[2] < 60 ? r4(+m[1] + +m[2] / 60) : NaN;
    const n = parseFloat(x.replace(',', '.')); return /^\d+([.,]\d+)?$/.test(x) ? n : NaN;
  };
  const pauseAus = v => { const x = parseStd(v); return x > 0 ? Math.round(x * 60) : 0; };
  const pausenMinuten = s => {
    const z = (s.zeiten || []).filter(x => !isNaN(zeitMin(x.von)) && !isNaN(zeitMin(x.bis))).slice().sort((a, b) => zeitMin(a.von) - zeitMin(b.von));
    let p = +s.pauseMin || 0;
    for (let i = 1; i < z.length; i++) { const l = zeitMin(z[i].von) - zeitMin(z[i - 1].bis); if (l > 0) p += l; }
    return p;
  };
  const zeitenText = s => (s.zeiten || []).map(z => z.von + '–' + z.bis).join(', ') + (s.laeuft ? ((s.zeiten || []).length ? ', ' : '') + hhmm(new Date(s.laeuft.seit)) + '–läuft' : '');
  const laufSek = s => s.laeuft ? Math.max(0, (Date.now() - new Date(s.laeuft.seit).getTime()) / 1000) : 0;
  const abgerechnet = s => !!(s.rechnungId || s.abschlagId || s.pauschalId);   // auch „mit Pauschale abgegolten“

  function toast(text, fehler) {
    const t = $('toast'); t.firstChild.textContent = text; t.firstChild.className = fehler ? 'fehler' : ''; t.style.display = 'block';
    clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, fehler ? 6000 : 2800);
  }
  const ls = {
    get: (k, d) => { try { const v = localStorage.getItem('zeit.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: (k, v) => { try { localStorage.setItem('zeit.' + k, JSON.stringify(v)); } catch (e) { /* voll */ } }
  };

  // ---------------------------------------------------------------- Zustand
  let cfg = ls.get('cfg', {});          // { url, login, pw, uid, pfad: [], maId }
  let cache = ls.get('cache', { projekte: {}, mitarbeiter: {}, stunden: {} });   // stunden: id -> { rec, lm }
  let tab = ls.get('tab', 'zeiten');
  let aenderungen = ls.get('aenderungen', []);
  const speichereCache = () => ls.set('cache', cache);

  // ---------------------------------------------------------------- WebDAV
  const auth = () => 'Basic ' + btoa(unescape(encodeURIComponent(cfg.login + ':' + cfg.pw)));
  const kodiere = teile => teile.map(encodeURIComponent).join('/');
  const basis = () => cfg.url + '/remote.php/dav/files/' + encodeURIComponent(cfg.uid) + '/';
  const datenPfad = teile => (cfg.pfad || []).concat(teile);
  async function dav(methode, teile, opts) {
    opts = opts || {};
    let r;
    try {
      r = await fetch(basis() + kodiere(teile) + (opts.ordner ? '/' : ''), { method: methode, cache: 'no-store', headers: Object.assign({ Authorization: auth() }, opts.headers || {}), body: opts.body });
    } catch (e) { const f = new Error('Keine Verbindung zur Nextcloud. Bitte Internetverbindung prüfen.'); f.offline = true; throw f; }
    if (r.status === 401) { const f = new Error('Anmeldung abgelehnt – App-Passwort ungültig oder gesperrt. Bitte unter ⚙ neu anmelden.'); f.auth = true; throw f; }
    return r;
  }
  const PROPFIND = '<?xml version="1.0"?><d:propfind xmlns:d="DAV:"><d:prop><d:resourcetype/><d:getlastmodified/></d:prop></d:propfind>';
  async function liste(teile) {
    const r = await dav('PROPFIND', teile, { ordner: true, headers: { Depth: '1', 'Content-Type': 'application/xml; charset=utf-8' }, body: PROPFIND });
    if (r.status === 404) throw new Error('Ordner nicht gefunden: /' + teile.join('/'));
    if (r.status !== 207) throw new Error('Fehler ' + r.status + ' beim Lesen von /' + teile.join('/'));
    const xml = new DOMParser().parseFromString(await r.text(), 'application/xml');
    const eigen = decodeURIComponent(new URL(basis() + kodiere(teile) + '/', location.href).pathname).replace(/\/+$/, '');
    const out = [];
    for (const resp of Array.from(xml.getElementsByTagNameNS('DAV:', 'response'))) {
      const p = decodeURIComponent(new URL(resp.getElementsByTagNameNS('DAV:', 'href')[0].textContent, location.href).pathname).replace(/\/+$/, '');
      if (p === eigen) continue;
      const lmEl = resp.getElementsByTagNameNS('DAV:', 'getlastmodified')[0];
      out.push({ name: p.split('/').pop(), ordner: resp.getElementsByTagNameNS('DAV:', 'collection').length > 0, lm: lmEl ? Date.parse(lmEl.textContent) || 0 : 0 });
    }
    return out;
  }
  async function leseJson(teile) {
    const r = await dav('GET', teile);
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('Fehler ' + r.status + ' beim Lesen');
    try { return JSON.parse(await r.text()); } catch (e) { return null; }
  }
  async function schreibeJson(teile, obj) {
    const r = await dav('PUT', teile, { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj, null, 1) });
    if (!(r.status === 201 || r.status === 204 || r.status === 200)) throw new Error('Speichern fehlgeschlagen (' + r.status + ')');
  }
  async function benutzerKennung() {
    let r;
    try {
      r = await fetch(cfg.url + '/remote.php/dav/', { method: 'PROPFIND', cache: 'no-store', headers: { Authorization: auth(), Depth: '0', 'Content-Type': 'application/xml; charset=utf-8' },
        body: '<?xml version="1.0"?><d:propfind xmlns:d="DAV:"><d:prop><d:current-user-principal/></d:prop></d:propfind>' });
    } catch (e) { throw new Error('Keine Verbindung zur Nextcloud. Adresse und Internetverbindung prüfen.'); }
    if (r.status === 401) throw new Error('Anmeldung abgelehnt: Benutzername oder App-Passwort falsch.');
    if (r.status !== 207) return cfg.login;
    const xml = new DOMParser().parseFromString(await r.text(), 'application/xml');
    const cup = xml.getElementsByTagNameNS('DAV:', 'current-user-principal')[0];
    const href = cup && cup.getElementsByTagNameNS('DAV:', 'href')[0];
    const m = href && href.textContent.match(/principals\/users\/([^/]+)\/?$/);
    return m ? decodeURIComponent(m[1]) : cfg.login;
  }

  // ---------------------------------------------------------------- Daten laden
  const ich = () => (cache.mitarbeiter[cfg.maId] || {}).rec || null;
  const meinName = () => (ich() || {}).name || cfg.login || '?';
  async function ladeTyp(typ, filter) {
    const dateien = (await liste(datenPfad(['_daten', typ]))).filter(x => !x.ordner && x.name.endsWith('.json') && !/conflict|\(/i.test(x.name));
    const ziel = cache[typ];
    const gesehen = new Set();
    const zuLaden = [];
    for (const f of dateien) {
      const id = f.name.slice(0, -5); gesehen.add(id);
      const alt = ziel[id];
      if (filter && !filter(f, alt)) { if (alt) delete ziel[id]; continue; }
      if (!alt || alt.lm !== f.lm || (alt.rec && alt.rec.laeuft)) zuLaden.push({ id, f });
    }
    for (const id of Object.keys(ziel)) if (!gesehen.has(id)) delete ziel[id];
    // parallel, aber begrenzt
    for (let i = 0; i < zuLaden.length; i += 8) {
      await Promise.all(zuLaden.slice(i, i + 8).map(async x => {
        const rec = await leseJson(datenPfad(['_daten', typ, x.f.name]));
        if (rec) ziel[x.id] = { rec, lm: x.f.lm };
      }));
    }
  }
  let ladend = false, geladenAm = ls.get('geladenAm', 0);
  async function ladeAlles(still) {
    if (ladend) return; ladend = true;
    try {
      await ladeTyp('mitarbeiter');
      await ladeTyp('projekte');
      const grenze = Date.now() - TAGE_LISTE * 86400000;
      // nur jüngere Dateien (nach Änderungszeit) und laufende Uhren laden
      await ladeTyp('stunden', (f, alt) => !f.lm || f.lm >= grenze || (alt && alt.rec && alt.rec.laeuft));
      for (const id of Object.keys(cache.stunden)) { const r = cache.stunden[id].rec; if (!r || r.mitarbeiterId !== cfg.maId) delete cache.stunden[id]; }
      warteUeberlagern();
      speichereCache(); geladenAm = Date.now(); offline = false; ls.set('geladenAm', geladenAm);
    } catch (e) {
      if (e.offline) { offline = true; warteUeberlagern(); aktualisiereStatus(); throw e; }
      if (!still) toast(e.message, true);
      if (e.auth) { cfg.pw = ''; ls.set('cfg', cfg); }
      throw e;
    } finally { ladend = false; }
  }
  const projekte = () => Object.values(cache.projekte).map(x => x.rec).filter(Boolean);
  const meineProjekte = () => projekte().filter(p => p.status !== 'abgeschlossen' && (p.team || []).some(t => t.mitarbeiterId === cfg.maId))
    .sort((a, b) => String(b.nummer || '').localeCompare(String(a.nummer || '')));
  const meineStunden = () => Object.values(cache.stunden).map(x => x.rec).filter(s => s && s.mitarbeiterId === cfg.maId);
  const projektName = id => { const p = (cache.projekte[id] || {}).rec; return p ? p.name || p.nummer : 'unbekanntes Projekt'; };

  // ---------------------------------------------------------------- Speichern
  async function signal(typ, id, rev, aktion) {
    aenderungen.push({ typ, id, rev, aktion, ts: new Date().toISOString() });
    aenderungen = aenderungen.slice(-60); ls.set('aenderungen', aenderungen);
    const nid = 'handy-' + String(cfg.uid).toLowerCase().replace(/[^a-z0-9_-]+/g, '-');
    try {
      await schreibeJson(datenPfad(['_signal', nid + '.json']), { nutzerId: nid, name: meinName() + ' (Handy)', ts: new Date().toISOString(), ansicht: '',
        letzteAenderung: aenderungen[aenderungen.length - 1].ts, aenderungen });
    } catch (e) { /* Signal ist nur ein Beschleuniger */ }
  }
  // ---------------------------------------------------------------- Warteschlange (offline)
  // Jede Änderung wird sofort auf dem Handy übernommen und in die Warteschlange gelegt; die Warteschlange
  // wird an die Nextcloud geschickt, sobald eine Verbindung besteht. Je Eintrag: { rec | null (löschen), basisRev (Stand der Nextcloud), ts, konflikt }
  let warte = ls.get('warteschlange', {});
  let offline = false, syncLaeuft = false, letzterSyncFehler = '';
  const speichereWarte = () => ls.set('warteschlange', warte);
  const anzahlWartend = () => Object.keys(warte).length;
  const anzahlKonflikte = () => Object.values(warte).filter(x => x.konflikt).length;

  /** Speichert einen Stundeneintrag (sofort auf dem Handy, dann an die Nextcloud). alt = Fassung, auf der die Änderung beruht */
  async function speichere(rec, alt) {
    if (alt && abgerechnet(alt)) throw new Error('Dieser Eintrag ist bereits abgerechnet und kann nicht mehr geändert werden.');
    const jetzt = new Date().toISOString();
    const vorher = warte[rec.id];
    const neu = Object.assign({}, rec, {
      rev: ((alt && alt.rev) || 0) + 1,
      erstelltAm: (alt && alt.erstelltAm) || rec.erstelltAm || jetzt,
      erstelltVon: (alt && alt.erstelltVon) || rec.erstelltVon || meinName() + ' (Handy)',
      geaendertAm: jetzt, geaendertVon: meinName() + ' (Handy)'
    });
    if (!neu.laeuft) delete neu.laeuftAuf;
    warte[neu.id] = { rec: neu, basisRev: vorher ? vorher.basisRev : (alt ? alt.rev : null), ts: jetzt };
    speichereWarte();
    cache.stunden[neu.id] = { rec: neu, lm: Date.now() }; speichereCache();
    await synchronisiere(true);
    return neu;
  }
  async function loesche(rec) {
    if (abgerechnet(rec)) throw new Error('Bereits abgerechnet – Löschen nicht möglich.');
    const vorher = warte[rec.id];
    if (vorher && vorher.basisRev === null) delete warte[rec.id];   // nie hochgeladen: einfach verwerfen
    else warte[rec.id] = { rec: null, basisRev: vorher ? vorher.basisRev : rec.rev, ts: new Date().toISOString() };
    speichereWarte();
    delete cache.stunden[rec.id]; speichereCache();
    await synchronisiere(true);
  }
  /** Warteschlange an die Nextcloud schicken. Konflikte (am PC geändert, gelöscht oder abgerechnet) werden nicht überschrieben. */
  async function synchronisiere(still) {
    if (syncLaeuft || !anzahlWartend() || !cfg.pw) { aktualisiereStatus(); return; }
    syncLaeuft = true;
    let neuerKonflikt = null;
    try {
      for (const id of Object.keys(warte).sort((x, y) => String(warte[x].ts).localeCompare(String(warte[y].ts)))) {
        const e = warte[id];
        if (!e || e.konflikt) continue;
        const pfad = datenPfad(['_daten', 'stunden', id + '.json']);
        const cur = await leseJson(pfad);
        // eigener Schreibvorgang ist schon angekommen (z. B. Verbindung beim Bestätigen abgerissen)
        if (cur && e.rec && cur.geaendertAm === e.rec.geaendertAm && cur.geaendertVon === e.rec.geaendertVon) {
          delete warte[id]; speichereWarte(); cache.stunden[id] = { rec: cur, lm: Date.now() }; continue;
        }
        if (!cur && !e.rec && e.basisRev !== null) { delete warte[id]; speichereWarte(); continue; }   // schon gelöscht
        const geaendert = e.basisRev === null ? !!cur : (!cur || cur.rev !== e.basisRev);
        if ((cur && abgerechnet(cur)) || geaendert) {
          e.konflikt = cur && abgerechnet(cur) ? 'abgerechnet' : (cur ? 'geaendert' : 'geloescht'); e.server = cur || null;
          speichereWarte(); if (!neuerKonflikt) neuerKonflikt = id; continue;
        }
        if (e.rec) {
          const out = Object.assign({}, e.rec, { rev: ((cur && cur.rev) || 0) + 1 });
          if (cur) { out.erstelltAm = cur.erstelltAm || out.erstelltAm; out.erstelltVon = cur.erstelltVon || out.erstelltVon; }
          await schreibeJson(pfad, out);
          if (warte[id] === e) { delete warte[id]; cache.stunden[id] = { rec: out, lm: Date.now() }; }
          else if (warte[id]) warte[id].basisRev = out.rev;   // während des Hochladens erneut geändert
          speichereWarte(); speichereCache();
          signal('stunden', id, out.rev, cur ? 'aendern' : 'neu');
        } else {
          const r = await dav('DELETE', pfad);
          if (!(r.status === 204 || r.status === 200 || r.status === 404)) throw new Error('Löschen fehlgeschlagen (' + r.status + ')');
          delete warte[id]; speichereWarte();
          signal('stunden', id, e.basisRev, 'loeschen');
        }
      }
      offline = false; letzterSyncFehler = '';
    } catch (err) {
      if (err.offline) offline = true;
      else { letzterSyncFehler = err.message; if (!still) toast(err.message, true); }
      if (err.auth) { cfg.pw = ''; ls.set('cfg', cfg); }
    } finally { syncLaeuft = false; }
    aktualisiereStatus();
    if (neuerKonflikt) zeigeKonflikt(neuerKonflikt);
  }
  /** Konflikt: beide Fassungen zeigen, Nutzer entscheidet */
  function zeigeKonflikt(id) {
    const e = warte[id]; if (!e || !e.konflikt) return;
    if (document.querySelector('.ov')) { if (!document.querySelector('.ov.konfliktblatt')) setTimeout(() => zeigeKonflikt(id), 400); return; }
    const kurz = r => r ? '<b>' + h(fmtStd(r.stunden)) + ' h</b> · ' + h(fmtTag(r.datum)) + (zeitenText(r) ? ' · ' + h(zeitenText(r)) : '') + '<br>' + h(r.beschreibung || '–') : '<i>gelöscht</i>';
    const grund = { geaendert: 'wurde inzwischen an anderer Stelle (z. B. am PC) geändert', geloescht: 'wurde inzwischen an anderer Stelle gelöscht', abgerechnet: 'ist inzwischen abgerechnet und kann nicht mehr geändert werden' }[e.konflikt];
    const ref = e.rec || e.server || {};
    const ov = blatt('Bitte entscheiden', '<p>Der Eintrag <b>' + h(projektName(ref.projektId)) + '</b> ' + grund + '.</p>' +
      '<div class="karte"><div class="klein">Ihre Fassung auf dem Handy</div>' + kurz(e.rec) + '</div>' +
      '<div class="karte"><div class="klein">Fassung in der Nextcloud</div>' + kurz(e.server) + '</div>' +
      (e.konflikt !== 'abgerechnet' ? '<button class="haupt" id="kMein">Meine Fassung übernehmen</button>' : '') +
      '<button class="zweit" id="kServer">' + (e.konflikt === 'abgerechnet' ? 'Verstanden – Fassung der Nextcloud behalten' : 'Fassung der Nextcloud übernehmen') + '</button>');
    ov.classList.add('konfliktblatt');
    if (ov.querySelector('#kMein')) ov.querySelector('#kMein').onclick = async () => {
      e.basisRev = e.server ? e.server.rev : null; delete e.konflikt; delete e.server; speichereWarte(); ov.remove();
      await synchronisiere(); render();
    };
    ov.querySelector('#kServer').onclick = async () => {
      if (e.server) cache.stunden[id] = { rec: e.server, lm: Date.now() }; else delete cache.stunden[id];
      delete warte[id]; speichereWarte(); speichereCache(); ov.remove(); render(); aktualisiereStatus();
      const naechster = Object.keys(warte).find(k => warte[k].konflikt); if (naechster) zeigeKonflikt(naechster);
    };
  }
  /** Lokale, noch nicht übertragene Änderungen über die geladenen Daten legen */
  function warteUeberlagern() {
    for (const [id, e] of Object.entries(warte)) { if (e.rec) cache.stunden[id] = { rec: e.rec, lm: Date.now() }; else delete cache.stunden[id]; }
  }
  function aktualisiereStatus() {
    const el = $('status'); if (!el) return;
    const n = anzahlWartend(), k = anzahlKonflikte();
    let t = '', art = '';
    if (k) { t = '⚠ ' + k + (k === 1 ? ' Eintrag braucht' : ' Einträge brauchen') + ' Ihre Entscheidung – antippen'; art = 'konflikt'; }
    else if (offline && n) { t = '⏳ Offline – ' + n + (n === 1 ? ' Änderung wartet' : ' Änderungen warten') + ' auf Verbindung'; art = 'offline'; }
    else if (offline) { t = 'Offline – Anzeige vom ' + (geladenAm ? hhmm(new Date(geladenAm)) + ' Uhr' : 'letzten Abruf'); art = 'offline'; }
    else if (n) { t = '⏳ ' + n + (n === 1 ? ' Änderung wird' : ' Änderungen werden') + ' übertragen …'; art = 'offline'; }
    el.textContent = t; el.className = art; el.style.display = t ? 'block' : 'none';
  }

  // ---------------------------------------------------------------- Uhr
  const eintragHeute = pid => meineStunden().filter(s => s.projektId === pid && s.datum === heute() && !abgerechnet(s))
    .sort((a, b) => (b.laeuft ? 1 : 0) - (a.laeuft ? 1 : 0) || String(b.geaendertAm || '').localeCompare(String(a.geaendertAm || '')))[0];
  async function starte(pid) {
    const e = eintragHeute(pid);
    if (e && e.laeuft) return;
    if (e) await speichere(Object.assign({}, e, { laeuft: { seit: new Date().toISOString() }, laeuftAuf: 'Handy' }), e);
    else await speichere({ id: uuid(), projektId: pid, datum: heute(), mitarbeiterId: cfg.maId, stunden: 0, beschreibung: '', ortstermin: false, rechnungId: null, abschlagId: null, zeiten: [], laeuft: { seit: new Date().toISOString() }, laeuftAuf: 'Handy' }, null);
  }
  function abschnittBis(s, ende) {
    const seit = new Date(s.laeuft.seit);
    const neu = Object.assign({}, s, { zeiten: (s.zeiten || []).concat([{ von: hhmm(seit), bis: hhmm(ende) }]) });
    delete neu.laeuft; delete neu.laeuftAuf;
    neu.stunden = stundenAusZeiten(neu);
    return neu;
  }
  async function stoppe(s) {
    const seit = new Date(s.laeuft.seit);
    if (isoTag(seit) !== heute() || laufSek(s) > MAX_LAUF_STD * 3600) return vergesseneUhr(s);
    const neu = await speichere(abschnittBis(s, new Date()), s);
    if (!neu.beschreibung) toast(fmtStd(neu.stunden) + ' h heute · Beschreibung fehlt noch – Eintrag antippen');
    return neu;
  }
  /** Uhr läuft seit gestern oder sehr lange: Ende erfragen */
  function vergesseneUhr(s) {
    return new Promise(resolve => {
      const seit = new Date(s.laeuft.seit);
      const ov = blatt('Uhr läuft noch', '<p>Die Uhr für <b>' + h(projektName(s.projektId)) + '</b> läuft seit <b>' + fmtTag(isoTag(seit)) + ' ' + hhmm(seit) + ' Uhr</b>.</p>' +
        '<label class="f">Wann haben Sie aufgehört? (' + fmtTag(isoTag(seit)) + ')</label><input class="uhrzeit" readonly inputmode="none" placeholder="--:--" data-titel="Ende der Arbeit" id="vEnde" value="' + (isoTag(seit) === heute() ? hhmm(new Date()) : '') + '">' +
        '<button class="haupt" id="vOk">Übernehmen</button><button class="zweit" id="vLaeuft">Läuft wirklich noch</button>');
      ov.querySelector('#vOk').onclick = async () => {
        const v = ov.querySelector('#vEnde').value;
        if (isNaN(zeitMin(v))) { toast('Bitte eine Uhrzeit eintragen.', true); return; }
        const ende = new Date(seit); ende.setHours(+v.slice(0, 2), +v.slice(3, 5), 0, 0);
        if (ende < seit) ende.setDate(ende.getDate() + 1); // nach Mitternacht
        try { await speichere(abschnittBis(s, ende), s); ov.remove(); render(); resolve(); } catch (e) { toast(e.message, true); }
      };
      ov.querySelector('#vLaeuft').onclick = () => { s._nichtFragen = true; geprueft.add(s.id); ov.remove(); resolve(); };
    });
  }
  const geprueft = new Set();
  async function pruefeVergessene() {
    for (const s of meineStunden().filter(x => x.laeuft && !geprueft.has(x.id))) {
      const seit = new Date(s.laeuft.seit);
      if (isoTag(seit) !== heute() || laufSek(s) > MAX_LAUF_STD * 3600) { geprueft.add(s.id); await vergesseneUhr(s); }
    }
  }

  // ---------------------------------------------------------------- Overlay
  function blatt(titel, inhalt) {
    const ov = document.createElement('div'); ov.className = 'ov';
    ov.innerHTML = '<div class="blatt"><h2><span></span><button aria-label="Schließen">✕</button></h2>' + inhalt + '</div>';
    ov.querySelector('h2 span').textContent = titel;
    ov.querySelector('h2 button').onclick = () => ov.remove();
    ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
    return ov;
  }

  /** Eintrag bearbeiten (Abschnitte, Pause, Dauer, Beschreibung, Ortstermin) */
  function bearbeite(s) {
    if (abgerechnet(s)) { toast('Bereits abgerechnet – Änderungen nur am PC über ein Storno.', true); return; }
    let zeiten = (s.zeiten || []).map(z => Object.assign({}, z));
    const projOpt = meineProjekte().concat(meineProjekte().some(p => p.id === s.projektId) ? [] : [(cache.projekte[s.projektId] || {}).rec].filter(Boolean));
    const ov = blatt(s.laeuft ? 'Eintrag (Uhr läuft)' : 'Eintrag bearbeiten',
      (s.laeuft ? '<div class="karte" style="border-color:var(--gruen)"><b>⏱ läuft seit ' + hhmm(new Date(s.laeuft.seit)) + ' Uhr</b><button class="zweit" id="bStop">Jetzt anhalten</button></div>' : '') +
      '<label class="f">Projekt</label><select id="bProj">' + projOpt.map(p => '<option value="' + h(p.id) + '"' + (p.id === s.projektId ? ' selected' : '') + '>' + h((p.nummer ? p.nummer + ' · ' : '') + p.name) + '</option>').join('') + '</select>' +
      '<label class="f">Datum</label><input type="date" id="bDatum" value="' + h(s.datum) + '">' +
      '<label class="f">Arbeitszeiten</label><div id="bZeiten"></div><div class="chips"><button class="chip" id="bPlus">+ Zeitraum</button></div>' +
      '<div class="zwei"><div><label class="f">Pause</label><input id="bPause" class="uhrzeit dauer" readonly inputmode="none" data-titel="Pause" value="' + h(s.pauseMin ? fmtMin(s.pauseMin) : '') + '" placeholder="0:00"></div>' +
      '<div><label class="f">Dauer</label><input id="bStd" class="uhrzeit dauer" readonly inputmode="none" data-titel="Dauer" value="' + h(fmtStd(s.stunden)) + '"></div></div>' +
      '<div class="klein" id="bHinweis"></div>' +
      '<label class="f">Beschreibung</label><textarea id="bBeschr" placeholder="Was wurde gemacht?">' + h(s.beschreibung || '') + '</textarea>' +
      '<label class="check">Ortstermin (Anfahrt)<input type="checkbox" id="bOrt"' + (s.ortstermin ? ' checked' : '') + '></label>' +
      '<button class="haupt" id="bSpeichern">Speichern</button><button class="gefahr" id="bLoeschen">Eintrag löschen</button>');
    const zeichne = () => {
      const box = ov.querySelector('#bZeiten');
      const sortiert = zeiten.map((z, i) => ({ z, i }));
      box.innerHTML = sortiert.map(({ z, i }, k) => {
        let pause = '';
        if (k > 0) { const l = zeitMin(z.von) - zeitMin(sortiert[k - 1].z.bis); if (l > 0) pause = '<div class="pausehinweis">Pause ' + fmtMin(l) + '</div>'; }
        return pause + '<div class="abschnitt"><input class="uhrzeit" readonly inputmode="none" placeholder="--:--" data-titel="Beginn" data-i="' + i + '" data-k="von" value="' + h(z.von) + '"><span>–</span><input class="uhrzeit" readonly inputmode="none" placeholder="--:--" data-titel="Ende" data-i="' + i + '" data-k="bis" value="' + h(z.bis) + '"><button data-del="' + i + '" aria-label="Abschnitt entfernen">✕</button></div>';
      }).join('') || '<div class="klein">keine – nur Dauer</div>';
      box.querySelectorAll('input').forEach(inp => inp.onchange = () => { zeiten[+inp.dataset.i][inp.dataset.k] = inp.value; aktualisiere(); zeichne(); });
      box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { zeiten.splice(+b.dataset.del, 1); aktualisiere(); zeichne(); });
      ov.querySelector('#bStd').disabled = zeiten.length > 0 || !!s.laeuft;
    };
    const aktualisiere = () => {
      if (zeiten.length) {
        const t = { zeiten: zeiten.filter(z => z.von && z.bis), pauseMin: pauseAus(ov.querySelector('#bPause').value) };
        ov.querySelector('#bStd').value = fmtStd(stundenAusZeiten(t));
        ov.querySelector('#bHinweis').textContent = 'Dauer aus den Arbeitszeiten (auf 5 Minuten gerundet)';
      } else ov.querySelector('#bHinweis').textContent = '';
    };
    ov.querySelector('#bPause').oninput = aktualisiere;
    ov.querySelector('#bPlus').onclick = () => { const letzte = zeiten[zeiten.length - 1]; zeiten.push({ von: letzte ? letzte.bis : '08:00', bis: '' }); zeichne(); };
    zeichne(); aktualisiere();
    if (s.laeuft) ov.querySelector('#bStop').onclick = async () => { try { await stoppe(s); ov.remove(); render(); toast('Uhr angehalten'); } catch (e) { toast(e.message, true); } };
    ov.querySelector('#bSpeichern').onclick = async () => {
      const neu = Object.assign({}, s, { projektId: ov.querySelector('#bProj').value, datum: ov.querySelector('#bDatum').value, beschreibung: ov.querySelector('#bBeschr').value.trim(), ortstermin: ov.querySelector('#bOrt').checked });
      const z = zeiten.filter(x => x.von || x.bis);
      if (z.some(x => isNaN(zeitMin(x.von)) || isNaN(zeitMin(x.bis)))) { toast('Bitte bei jedem Zeitraum Beginn und Ende eintragen.', true); return; }
      const pause = pauseAus(ov.querySelector('#bPause').value);
      if (z.length || s.laeuft) { neu.zeiten = z; neu.pauseMin = pause; neu.stunden = stundenAusZeiten(neu); if (!pause) delete neu.pauseMin; }
      else { delete neu.zeiten; delete neu.pauseMin; neu.stunden = parseStd(ov.querySelector('#bStd').value); }
      if (!neu.laeuft && !(neu.stunden > 0 && neu.stunden <= 24)) { toast('Die Dauer muss zwischen 0:05 und 24:00 liegen.', true); return; }
      if (!neu.datum) { toast('Bitte ein Datum wählen.', true); return; }
      const btn = ov.querySelector('#bSpeichern'); btn.disabled = true;
      try { await speichere(neu, s); ov.remove(); toast(warte[neu.id] && !warte[neu.id].konflikt ? 'Auf dem Handy gespeichert – wird übertragen, sobald Verbindung besteht' : 'Gespeichert'); render(); } catch (e) { toast(e.message, true); btn.disabled = false; }
    };
    ov.querySelector('#bLoeschen').onclick = async () => {
      if (!confirm('Diesen Eintrag löschen?')) return;
      try { await loesche(s); ov.remove(); toast('Gelöscht'); render(); } catch (e) { toast(e.message, true); }
    };
  }

  // ---------------------------------------------------------------- Uhrzeit-Auswahl (Zifferblatt: erst Stunde, dann Minute)
  function uhrWaehlen(input) {
    const dauer = input.classList.contains('dauer');   // Dauer/Pause: Stunden 0–23 statt Uhrzeit
    const jetzt = new Date();
    const start = dauer ? (parseStd(input.value) > 0 ? Math.round(parseStd(input.value) * 60) : 0) : zeitMin(input.value);
    let std = !isNaN(start) ? Math.floor(start / 60) : jetzt.getHours();
    let min = !isNaN(start) ? start % 60 : Math.round(jetzt.getMinutes() / 5) * 5 % 60;
    if (dauer) std = Math.min(std, 23);
    let modus = (dauer && input.dataset.titel === 'Pause') ? 'min' : 'std';
    const titel = input.dataset.titel || 'Uhrzeit';
    const ov = document.createElement('div'); ov.className = 'uhrwahl';
    ov.innerHTML = '<div class="box"><div class="titel"></div><div class="anzeige"><button data-m="std"></button><span>:</span><button data-m="min"></button></div>' +
      '<svg width="260" height="260" viewBox="0 0 260 260"></svg>' +
      '<div class="knoepfe"><button data-a="jetzt">' + (dauer ? 'Keine' : 'Jetzt') + '</button><span><button data-a="ab">Abbrechen</button><button data-a="ok">OK</button></span></div></div>';
    ov.querySelector('.titel').textContent = String(titel).trim() || 'Uhrzeit';
    const svg = ov.querySelector('svg');
    const C = 130, R_AUSSEN = 104, R_INNEN = 68;
    const pos = (i, r) => { const w = (i / 12) * 2 * Math.PI - Math.PI / 2; return [C + r * Math.cos(w), C + r * Math.sin(w)]; };
    function zeichne() {
      ov.querySelector('[data-m="std"]').textContent = dauer ? String(std) : pad(std);
      ov.querySelector('[data-m="min"]').textContent = pad(min);
      ov.querySelectorAll('.anzeige button').forEach(b => b.classList.toggle('an', b.dataset.m === modus));
      let x = '<circle cx="' + C + '" cy="' + C + '" r="126" fill="#eceae5"/>';
      let zeiger;
      if (modus === 'std') {
        const innen = dauer ? std >= 12 : (std === 0 || std > 12);
        zeiger = pos(std % 12, innen ? R_INNEN : R_AUSSEN);
        x += '<line x1="' + C + '" y1="' + C + '" x2="' + zeiger[0] + '" y2="' + zeiger[1] + '" stroke="#1f4e79" stroke-width="2"/><circle cx="' + C + '" cy="' + C + '" r="4" fill="#1f4e79"/><circle cx="' + zeiger[0] + '" cy="' + zeiger[1] + '" r="19" fill="#1f4e79"/>';
        for (let i = 0; i < 12; i++) {
          const a = dauer ? i : (i === 0 ? 12 : i), b = dauer ? i + 12 : (i === 0 ? 0 : i + 12);
          const [ax, ay] = pos(i, R_AUSSEN), [bx, by] = pos(i, R_INNEN);
          x += '<text x="' + ax + '" y="' + ay + '" text-anchor="middle" dominant-baseline="central" font-size="17" fill="' + (std === a ? '#fff' : '#1d1d1b') + '">' + (dauer ? a + ' h' : a) + '</text>';
          x += '<text x="' + bx + '" y="' + by + '" text-anchor="middle" dominant-baseline="central" font-size="14" fill="' + (std === b ? '#fff' : '#5c5b56') + '">' + (dauer ? b : pad(b)) + '</text>';
        }
      } else {
        zeiger = pos(min / 5, R_AUSSEN);
        x += '<line x1="' + C + '" y1="' + C + '" x2="' + zeiger[0] + '" y2="' + zeiger[1] + '" stroke="#1f4e79" stroke-width="2"/><circle cx="' + C + '" cy="' + C + '" r="4" fill="#1f4e79"/><circle cx="' + zeiger[0] + '" cy="' + zeiger[1] + '" r="19" fill="#1f4e79"/>';
        if (min % 5) x += '<circle cx="' + zeiger[0] + '" cy="' + zeiger[1] + '" r="3" fill="#fff"/>';
        for (let i = 0; i < 12; i++) {
          const [ax, ay] = pos(i, R_AUSSEN);
          x += '<text x="' + ax + '" y="' + ay + '" text-anchor="middle" dominant-baseline="central" font-size="17" fill="' + (min === i * 5 ? '#fff' : '#1d1d1b') + '">' + pad(i * 5) + '</text>';
        }
      }
      svg.innerHTML = x;
    }
    function waehle(e) {
      const r = svg.getBoundingClientRect();
      const dx = (e.clientX - r.left) * (260 / r.width) - C, dy = (e.clientY - r.top) * (260 / r.height) - C;
      let w = Math.atan2(dy, dx) + Math.PI / 2; if (w < 0) w += 2 * Math.PI;
      const abst = Math.sqrt(dx * dx + dy * dy);
      if (modus === 'std') {
        const i = Math.round(w / (2 * Math.PI) * 12) % 12;
        const innen = abst < (R_AUSSEN + R_INNEN) / 2;
        std = dauer ? (innen ? i + 12 : i) : (innen ? (i === 0 ? 0 : i + 12) : (i === 0 ? 12 : i));
      } else {
        min = (Math.round(w / (2 * Math.PI) * 12) % 12) * 5;   // 5-Minuten-Schritte
      }
      zeichne();
    }
    let gedrueckt = false;
    svg.addEventListener('pointerdown', e => { gedrueckt = true; try { svg.setPointerCapture(e.pointerId); } catch (x) { /* egal */ } waehle(e); });
    svg.addEventListener('pointermove', e => { if (gedrueckt) waehle(e); });
    svg.addEventListener('pointerup', e => { if (!gedrueckt) return; gedrueckt = false; waehle(e); if (modus === 'std') { modus = 'min'; setTimeout(zeichne, 180); } });
    ov.querySelectorAll('.anzeige button').forEach(b => b.onclick = () => { modus = b.dataset.m; zeichne(); });
    const fertig = wert => {
      ov.remove();
      if (wert === undefined) return;
      input.value = wert;
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
    };
    ov.querySelector('[data-a="ok"]').onclick = () => fertig(dauer ? (std || min ? std + ':' + pad(min) : '') : pad(std) + ':' + pad(min));
    ov.querySelector('[data-a="ab"]').onclick = () => fertig();
    ov.querySelector('[data-a="jetzt"]').onclick = () => { if (dauer) return fertig(''); const d = new Date(); std = d.getHours(); min = d.getMinutes(); modus = 'min'; zeichne(); };
    ov.addEventListener('click', e => { if (e.target === ov) fertig(); });
    zeichne();
    document.body.appendChild(ov);
  }

  function renderZeiten() {

      return String(zuletzt[b.id] || '').localeCompare(String(zuletzt[a.id] || '')) || String(b.nummer || '').localeCompare(String(a.nummer || ''));
    });

    laufend.filter(s => !proj.some(p => p.id === s.projektId)).forEach(s => { const p = (cache.projekte[s.projektId] || {}).rec; if (p) reihe.unshift(p); });

    const karten = reihe.map(p => {
      const e = laufend.find(s => s.projektId === p.id) || eintragHeute(p.id);
      const lauf = e && e.laeuft;
      const sek = e ? Math.max(0, rohMinuten(e)) * 60 + laufSek(e) : 0;
      let info;
      if (lauf) info = 'läuft seit ' + hhmm(new Date(e.laeuft.seit)) + ((e.zeiten || []).length ? ' · heute ' + ((e.zeiten || []).length + 1) + ' Abschnitte' : '');

        '<button class="rund ' + (lauf ? 'stop' : e ? 'play' : 'leer') + '" data-knopf="' + h(p.id) + '" aria-label="' + (lauf ? 'Anhalten' : 'Starten') + '">' + (lauf ? '❚❚' : '▶') + '</button></div>';

  }

  function renderListe() {

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') auffrischen(); });
  window.addEventListener('online', () => auffrischen());
  window.addEventListener('offline', () => { offline = true; aktualisiereStatus(); });
  setInterval(() => { if (anzahlWartend() && document.visibilityState === 'visible') synchronisiere(true); }, 30000);
  $('status').onclick = () => { const k = Object.keys(warte).find(x => warte[x].konflikt); if (k) zeigeKonflikt(k); else if (anzahlWartend()) synchronisiere(); };

  async function start() {
    if (!cfg.pw || !cfg.uid || !(cfg.pfad || []).length || !cfg.maId) return render();
    warteUeberlagern();
    render();
    await synchronisiere(true);
    try { await ladeAlles(); } catch (e) { if (e.auth) return renderEinrichtung('login'); }
    if (!ich()) { if (offline) return render(); cfg.maId = ''; ls.set('cfg', cfg); return renderEinrichtung('mitarbeiter'); }
    render();
    await pruefeVergessene();
  }
  // Offline-Fähigkeit: App-Dateien auf dem Handy ablegen; Speicher möglichst dauerhaft
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => { /* ohne Offline-Start weiter nutzbar */ });
    navigator.serviceWorker.addEventListener('message', e => { if (e.data === 'neue-version') toast('Neue Version geladen – wird beim nächsten Öffnen verwendet.'); });
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  window.__zeit = { cfg: () => cfg, cache: () => cache, warte: () => warte, stundenAusZeiten, parseStd, fmtStd };
  start();
})();
